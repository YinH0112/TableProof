[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tableproof-research"
version = "0.1.0"
description = "Local, source-traceable review of research PDF tables"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pdfplumber>=0.11.7,<0.12",
  "openpyxl>=3.1.5,<4",
]

[project.scripts]
tableproof = "tableproof.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "reportlab>=4.3,<5", "pypdf>=5,<7", "pyinstaller>=6.16,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/tableproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
